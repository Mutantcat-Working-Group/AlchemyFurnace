name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -ntp package

  rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo build
      - run: cargo test

  go:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go vet ./...

  typescript:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit AlchemyFurnace.ts Example.ts

  php:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -l AlchemyFurnace.php

  python:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile AlchemyFurnace.py

  c-cpp:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: c-cpp
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: g++ -std=c++11 -fsyntax-only Example.cpp

  csharp:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: csharp/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - run: dotnet build
